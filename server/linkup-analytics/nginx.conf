user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # HTTP:80 的 www.egoistcookie.top 由 conf.d（常见为 certbot）提供，此处不要再写，
    # 否则会报 conflicting server name ... on 0.0.0.0:80
    include /etc/nginx/conf.d/*.conf;

	# HTTPS 主配置（新版 nginx：listen 与 http2 分开写）
	server {
		listen 443 ssl;
		http2 on;
		server_name www.egoistcookie.top;

		# SSL 证书配置
		ssl_certificate /etc/letsencrypt/live/www.egoistcookie.top/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/www.egoistcookie.top/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		# 安全头配置
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "no-referrer-when-downgrade" always;

		# 日志配置
		access_log /var/log/nginx/access.log;
		error_log /var/log/nginx/error.log;

		# 客户端最大请求体大小
		client_max_body_size 10M;

		# Gzip 压缩配置
		gzip on;
		gzip_vary on;
		gzip_min_length 1024;
		gzip_comp_level 6;
		gzip_types text/plain text/css text/xml text/javascript 
				   application/x-javascript application/xml+rss 
				   application/json application/javascript 
				   image/svg+xml;

		# ========================================
		# 原有服务配置
		# ========================================

		# 原有服务 - 通过 /water 路径访问
		location /water/ {
			proxy_pass http://127.0.0.1:5000/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			
			# WebSocket 支持
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		# 原有服务的 API 路径
		location /worknoteApi {
			proxy_pass http://localhost:3000;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_cache_bypass $http_upgrade;
			
			# 超时设置
			proxy_connect_timeout 60s;
			proxy_send_timeout 60s;
			proxy_read_timeout 60s;
			
			# 允许大文件上传
			client_max_body_size 10M;
		}

		# 原有服务的健康检查
		location /worknoteApi/health {
			proxy_pass http://localhost:3000/health;
			access_log off;
		}

		# ========================================
		# 登录演示系统配置
		# ========================================

		# 连连看埋点（必须在通用 /api/ 之前）
		location /api/linkup/ {
			proxy_pass http://127.0.0.1:8765;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_connect_timeout 5s;
			proxy_send_timeout 15s;
			proxy_read_timeout 15s;
			client_max_body_size 256k;
		}

		# 登录演示系统 - API 请求代理到后端
		location /api/ {
			proxy_pass http://127.0.0.1:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			proxy_set_header X-Forwarded-Port $server_port;

			# WebSocket 支持
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";

			# 超时配置
			proxy_connect_timeout 60s;
			proxy_send_timeout 60s;
			proxy_read_timeout 60s;

			# 缓冲配置
			proxy_buffering off;
			proxy_request_buffering off;
		}

		# 登录演示系统 - 静态资源缓存
		location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
			root /home/projectJar/frontend;
			expires 1y;
			add_header Cache-Control "public, immutable";
			access_log off;
		}

		# 登录演示系统 - 默认主页（React Router 支持）
		# 注意：这个要放在最后，作为默认匹配
		location / {
			root /home/projectJar/frontend;
			index index.html;
			try_files $uri $uri/ /index.html;
		}

		# 塔防游戏埋点服务 start
		# API 接口
    location /api/analytics/ {
        proxy_pass http://localhost:3001/api/analytics/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }	
		# 塔防游戏埋点服务 end

		# ========================================
		# 通用配置
		# ========================================

		# 禁止访问隐藏文件
		location ~ /\. {
			deny all;
			access_log off;
			log_not_found off;
		}

		# 健康检查端点
		location /health {
			access_log off;
			return 200 "healthy\n";
			add_header Content-Type text/plain;
		}
	}

}
